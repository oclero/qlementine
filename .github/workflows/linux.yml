name: Linux

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64

      - name: Build the library.
        run: |
          cmake --preset linux -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
          cmake --build --preset linux --target qlementine

      - name: Build the Qt style plugin.
        run: cmake --build --preset linux --target qlementinestyleplugin

      - name: Install the library and plugin.
        run: cmake --build --preset linux --target install

      - name: Build the Sandbox app.
        run: cmake --build --preset linux-sandbox
