name: Linux

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library_type: [static, shared]
        include:
          - library_type: static
            preset: linux
            description: "Static Library"
          - library_type: shared
            preset: linux-shared
            description: "Shared Library"

    name: Build (${{ matrix.description }})

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: linux
          target: desktop
          arch: linux_gcc_64

      - name: Build the library (${{ matrix.description }})
        run: |
          cmake --preset ${{ matrix.preset }} -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
          cmake --build --preset ${{ matrix.preset }} --target qlementine

      - name: Build the Qt style plugin (${{ matrix.description }})
        run: cmake --build --preset ${{ matrix.preset }} --target qlementinestyleplugin

      - name: Install the library and plugin (${{ matrix.description }})
        run: cmake --build --preset ${{ matrix.preset }} --target install

      - name: Build the Sandbox app.
        if: matrix.library_type == 'static'
        run: cmake --build --preset linux-sandbox
