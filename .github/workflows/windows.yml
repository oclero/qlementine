name: Windows

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Build the library.
        run: |
          cmake --preset windows-ci -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build --preset windows-ci --target qlementine

      - name: Build the Qt style plugin.
        run: cmake --build --preset windows-ci --target qlementinestyleplugin

      - name: Install the library and plugin.
        run: cmake --build --preset windows-ci --target install

      - name: Build the Sandbox app.
        run: cmake --build --preset windows-ci-sandbox
